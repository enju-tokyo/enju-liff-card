<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>煙寿 -enju- 会員証</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">

<style>
  :root {
    --gold:        #C9A24B;
    --gold-light:  #E7CF92;
    --ink:         #EDE9E1;
    --ink-dim:     #9C9689;
    --ink-faint:   #6E6A62;
    --card-bg:     #060606;

    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --gothic: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #000;
    color: var(--ink);
    font-family: var(--gothic);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     カード本体 ── 「極」の枠に「煙」を流し込んだデザイン
     ============================================================ */

  .card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    width: 100%;
    max-width: 360px;
    min-height: 232px;
    display: flex;
    gap: 18px;
    padding: 30px 22px 26px;
    background: var(--card-bg);
    border: 1px solid rgba(201, 162, 75, .38);
    border-radius: 4px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .6);
    animation: rise .9s cubic-bezier(.22, 1, .36, 1) both;
  }

  /* 漂う煙 */
  .smoke {
    position: absolute;
    inset: -32%;
    z-index: 0;
    background:
      radial-gradient(38% 32% at 26% 30%, rgba(201, 162, 75, .26), transparent 68%),
      radial-gradient(32% 28% at 72% 60%, rgba(122, 148, 158, .20), transparent 70%),
      radial-gradient(28% 24% at 50% 90%, rgba(201, 162, 75, .13), transparent 72%);
    filter: blur(30px);
    animation: drift 26s ease-in-out infinite alternate;
  }

  /* 四隅を沈ませて、煙が枠に触れないようにする */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    box-shadow: inset 0 0 64px 22px rgba(0, 0, 0, .62);
  }

  .body,
  .spine { position: relative; z-index: 2; }

  .body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* 縦組みの店名 */
  .spine {
    flex: 0 0 auto;
    writing-mode: vertical-rl;
    font-family: var(--mincho);
    font-weight: 600;
    font-size: 21px;
    letter-spacing: .34em;
    color: var(--gold);
    border-left: 1px solid rgba(201, 162, 75, .22);
    padding-left: 14px;
  }
  .spine em {
    font-style: normal;
    display: block;
    font-family: var(--gothic);
    font-weight: 400;
    font-size: 8px;
    letter-spacing: .3em;
    color: var(--ink-faint);
    margin-top: 10px;
  }

  /* 会員番号まわり */
  .label {
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }

  .member-no {
    font-family: var(--mincho);
    font-weight: 400;
    font-size: 54px;
    line-height: 1;
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(100deg, #7E611F 0%, #D9BC7A 32%, #F7EDD2 44%, #C9A24B 58%, #8A6A28 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule {
    height: 1px;
    background: linear-gradient(90deg, rgba(201, 162, 75, .55), transparent);
    margin: 22px 0 14px;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: auto;
  }
  .name {
    font-size: 14px;
    letter-spacing: .04em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    letter-spacing: .18em;
    color: var(--ink-dim);
  }
  .status::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
  }
  .status.is-inactive::before { background: #4E4B45; }

  /* 読み込み中・エラー時 */
  .state {
    margin: auto 0;
    font-size: 13px;
    line-height: 1.8;
    color: var(--ink-dim);
    letter-spacing: .04em;
  }
  .state.is-error { color: #D08C86; }

  /* ---------- 動き ---------- */

  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(6%, -5%, 0) scale(1.12); }
    100% { transform: translate3d(-5%, 4%, 0) scale(1.04); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .reveal { animation: fade .55s ease both; }

  @media (prefers-reduced-motion: reduce) {
    .smoke, .card, .reveal { animation: none; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="smoke" aria-hidden="true"></div>

  <div class="body" id="content">
    <div class="state">読み込み中...</div>
  </div>

  <div class="spine">煙寿<em>ENJU</em></div>
</div>

<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ▼▼▼ この2行は今動いている値です。もし違っていたら、現在のindex.htmlの値をそのまま使ってください ▼▼▼
  var LIFF_ID = '2011054984-IWt9nIdg'; // LINE DevelopersでLIFFアプリを作成後に発行されるID
  var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwuPriA9icKvO2hCBsmh0U6MjYU8qDEUY-5zcOdrDRcGBTAgn8wDF044JIaT2HOMofz/exec'; // Apps Scriptの「デプロイ」で発行された /exec URL
  // ▲▲▲ ここまで ▲▲▲

  var contentEl = document.getElementById('content');

  function showState(html, isError) {
    contentEl.innerHTML = '<div class="state' + (isError ? ' is-error' : '') + '">' + html + '</div>';
  }

  function showCard(data) {
    var isActive = data.status === 'active';
    contentEl.innerHTML =
      '<div class="label">MEMBER No.</div>' +
      '<div class="member-no">' + escapeHtml(data.membershipNo) + '</div>' +
      '<div class="rule"></div>' +
      '<div class="foot">' +
      '<div class="name">' + escapeHtml(data.name || 'お客') + ' 様</div>' +
      '<div class="status' + (isActive ? '' : ' is-inactive') + '">' + (isActive ? 'ACTIVE' : 'INACTIVE') + '</div>' +
      '</div>';
    contentEl.classList.add('reveal');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // JSONPでGASのAPIを呼び出す（CORSの制約を避けるため）
  function fetchMemberInfo(idToken) {
    var callbackName = 'enjuMemberCallback_' + Date.now();
    window[callbackName] = function (data) {
      delete window[callbackName];
      document.body.removeChild(script);

      if (data.error) {
        showState('会員情報の取得に失敗しました。<br>時間をおいて再度お試しください。', true);
        return;
      }
      if (!data.found) {
        showState('会員情報が見つかりませんでした。<br>お手数ですが、一度友だち解除→再度友だち追加をお試しください。', true);
        return;
      }
      showCard(data);
    };

    var url =
      GAS_API_URL +
      '?action=lookup' +
      '&idToken=' + encodeURIComponent(idToken) +
      '&callback=' + callbackName;

    var script = document.createElement('script');
    script.src = url;
    script.onerror = function () {
      showState('会員情報の取得に失敗しました（通信エラー）。', true);
    };
    document.body.appendChild(script);
  }

  function init() {
    if (LIFF_ID === 'YOUR_LIFF_ID') {
      showState('LIFF_IDが設定されていません。index.html内のLIFF_IDを書き換えてください。', true);
      return;
    }

    liff
      .init({ liffId: LIFF_ID })
      .then(function () {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        var idToken = liff.getIDToken();
        if (!idToken) {
          showState('ログイン情報が取得できませんでした。', true);
          return;
        }
        fetchMemberInfo(idToken);
      })
      .catch(function (err) {
        showState('LIFFの初期化に失敗しました。<br>' + escapeHtml(err.message || err), true);
      });
  }

  init();
</script>
</body>
</html>
