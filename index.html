<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>煙寿 -enju- 会員証</title>
<style>
  :root {
    --gold: #c9a24b;
    --gold-light: #e6c877;
    --bg: #0e0e0e;
    --card-bg: #161616;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #f2f2f2;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(160deg, var(--card-bg), #0a0a0a);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .brand {
    text-align: center;
    letter-spacing: 0.15em;
    color: var(--gold-light);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .brand-en {
    text-align: center;
    letter-spacing: 0.1em;
    color: #8a8a8a;
    font-size: 11px;
    margin-bottom: 24px;
  }
  .label {
    font-size: 12px;
    color: #9a9a9a;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .member-no {
    font-size: 40px;
    font-weight: bold;
    color: var(--gold-light);
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #2a2a2a;
    padding-top: 14px;
    margin-top: 14px;
  }
  .name {
    font-size: 15px;
  }
  .badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--gold);
    color: var(--gold-light);
  }
  .state {
    text-align: center;
    color: #b5b5b5;
    font-size: 14px;
    padding: 20px 0;
  }
  .error {
    color: #e07a7a;
  }
  .note {
    margin-top: 20px;
    font-size: 11px;
    color: #6f6f6f;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="brand">煙 寿</div>
  <div class="brand-en">- e n j u -  M E M B E R S H I P</div>
  <div id="content" class="state">読み込み中...</div>
</div>

<!-- LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ▼▼▼ ここの2つを、実際の値に差し替えてください ▼▼▼
  var LIFF_ID = '2011054984-IWt9nIdg'; // LINE DevelopersでLIFFアプリを作成後に発行されるID
var GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwuPriA9icKvO2hCBsmh0U6MjYU8qDEUY-5zcOdrDRcGBTAgn8wDF044JIaT2HOMofz/exec'
; // Apps Scriptの「デプロイ」で発行された /exec URL
  // ▲▲▲ ここまで ▲▲▲

  var contentEl = document.getElementById('content');

  function showState(html, isError) {
    contentEl.className = isError ? 'state error' : 'state';
    contentEl.innerHTML = html;
  }

  function showCard(data) {
    var statusLabel = data.status === 'active' ? '会員' : '休会中';
    var html =
      '<div class="label">会員番号</div>' +
      '<div class="member-no">' + escapeHtml(data.membershipNo) + '</div>' +
      '<div class="row">' +
      '<div class="name">' + escapeHtml(data.name || 'お客様') + '様</div>' +
      '<div class="badge">' + statusLabel + '</div>' +
      '</div>' +
      '<div class="note">この画面はLINEアプリ内でのみ正しく開けます</div>';
    contentEl.innerHTML = html;
    contentEl.className = '';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // JSONPでGASのAPIを呼び出す（CORSの制約を避けるため）
  function fetchMemberInfo(idToken) {
    var callbackName = 'enjuMemberCallback_' + Date.now();
    window[callbackName] = function (data) {
      delete window[callbackName];
      document.body.removeChild(script);

      if (data.error) {
        showState('会員情報の取得に失敗しました。<br>時間をおいて再度お試しください。', true);
        return;
      }
      if (!data.found) {
        showState('会員情報が見つかりませんでした。<br>お手数ですが、一度友だち解除→再度友だち追加をお試しください。', true);
        return;
      }
      showCard(data);
    };

    var url =
      GAS_API_URL +
      '?action=lookup' +
      '&idToken=' + encodeURIComponent(idToken) +
      '&callback=' + callbackName;

    var script = document.createElement('script');
    script.src = url;
    script.onerror = function () {
      showState('会員情報の取得に失敗しました（通信エラー）。', true);
    };
    document.body.appendChild(script);
  }

  function init() {
    if (LIFF_ID === 'YOUR_LIFF_ID') {
      showState('LIFF_IDが設定されていません。index.html内のLIFF_IDを書き換えてください。', true);
      return;
    }

    liff
      .init({ liffId: LIFF_ID })
      .then(function () {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        var idToken = liff.getIDToken();
        if (!idToken) {
          showState('ログイン情報が取得できませんでした。', true);
          return;
        }
        fetchMemberInfo(idToken);
      })
      .catch(function (err) {
        showState('LIFFの初期化に失敗しました。<br>' + escapeHtml(err.message || err), true);
      });
  }

  init();
</script>
</body>
</html>
